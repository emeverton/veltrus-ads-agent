name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'api/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR=/opt/veltrus
            mkdir -p "$APP_DIR"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR" && git fetch origin main && git reset --hard origin/main
            else
              git clone --branch main --depth 1 https://github.com/emeverton/veltrus-ads-agent.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            bash setup.sh
