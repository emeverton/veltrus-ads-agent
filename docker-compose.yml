version: "3.9"

# =============================================================================
# Veltrus Ads Agent — Docker Compose
#
# Uso local:
#   docker compose up --build
#
# Uso em Swarm (VPS):
#   docker build -t veltrus:latest .
#   docker stack deploy -c docker-compose.yml veltrus
#   # ou atualizar serviços individualmente:
#   docker service update --image veltrus:latest veltrus_api
#   docker service update --image veltrus:latest veltrus_agent
# =============================================================================

services:
  api:
    image: veltrus:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 10

  agent:
    image: veltrus:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m agent.main
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - api
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 10
